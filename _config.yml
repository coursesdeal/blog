# Site settings
title:          coursesdeal
description:    "Courses Deals"


# Google Analytics
google_analytics: UA—XXXXXXXX-X

# Author
author:
  name:         coursesdeal
  url:          coursesdeal.com
  email:        coursesdeal@gmail.com

# Build settings
remote_theme: chesterhow/tale
markdown:       kramdown
include:
  - _pages
  - _posts

# Assets
sass:
  sass_dir:     _sass
  style:        compressed

# Gems
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  # - jemoji #Uncomment this to allow emoji in your post

# Permalinks
permalink:      /pretty
paginate:       5

# Excludes
exclude: [ Gemfile, Gemfile.lock, tale.gemspec ]

# Disqus (Set to your disqus id)
disqus:         jekyll-tale